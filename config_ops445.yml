---
- name: Configure OPS445 VM
  hosts: lab8
  become: yes
  vars:
    seneca_id: "eroshy"
  tasks:
    - name: Update Apache (skip repos if broken)
      yum:
        name: httpd
        state: latest
      ignore_errors: yes

    - name: Install EPEL if available
      yum:
        name: epel-release
        state: present
      ignore_errors: yes

    - name: Remove tree package
      yum:
        name: tree
        state: absent
      ignore_errors: yes

    - name: Set hostname to eroshy
      hostname:
        name: "{eroshy}"

    - name: Create Seneca user with sudo
      user:
        name: "{eroshy}"
        groups: wheel
        append: yes
        create_home: yes
        shell: /bin/bash

    - name: Copy SSH key to new user
      authorized_key:
        user: "{eroshy}"
        key: "{{ lookup('file', lookup('env','HOME') + '/.ssh/ops445.pub') }}"

    - name: Ensure sudoers allows wheel NOPASSWD
      lineinfile:
        path: /etc/sudoers
        state: present
        regexp: '^%wheel\s+ALL=\(ALL\)\s+NOPASSWD:'
        line: '%wheel ALL=(ALL) NOPASSWD: ALL'
        validate: 'visudo -cf %s'

    - name: Create ops445 lab directory structure
      file:
        path: "/home/eroshy/ops445/lab8"
        state: directory
        owner: "eroshy"
        group: "eroshy"
      loop:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
